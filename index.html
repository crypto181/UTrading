<script type="text/babel">

  };
  const OWNER_WALLET = 'TVmeVKvkYebBTh6EF66EBm2BoVqCwGbhL4'; // owner TRC20 — fees credited here

  const MOCK_TRADES=[
    {pair:'BTC/USDT',side:'BUY', entry:'67,240',exit:'68,100',pnl:'+12.50',pct:'+1.28%',time:'08:34',status:'Closed'},
    {pair:'ETH/USDT',side:'SELL',entry:'3,520', exit:'3,490', pnl:'+8.50', pct:'+0.85%',time:'11:15',status:'Closed'},

  ];

  const enc=(t,k)=>CryptoJS.AES.encrypt(t,k).toString();
  const dec=(c,k)=>{try{return CryptoJS.AES.decrypt(c,k).toString(CryptoJS.enc.Utf8)}catch{return''}};

  // ── UI Primitives ─────────────────────────────────────────────────────────
  const font={fontFamily:"'Exo 2',sans-serif"};
  const mono={fontFamily:"'Share Tech Mono',monospace"};
  const orb ={fontFamily:"'Orbitron',sans-serif"};

  const Box=({style,children,...r})=>(
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:16,...style}}{...r}>{children}</div>
  );
  const Badge=({label,color})=>(
    <span style={{background:`${color}22`,color,border:`1px solid ${color}44`,borderRadius:6,
      padding:'2px 8px',fontSize:11,...mono,whiteSpace:'nowrap'}}>{label}</span>
  );
  const Input=({value,onChange,placeholder,type='text',style,readOnly})=>(
    <input type={type} value={value} onChange={e=>onChange&&onChange(e.target.value)}
      placeholder={placeholder} readOnly={readOnly}
      style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,color:C.text,
        padding:'11px 14px',width:'100%',outline:'none',...style}}
      onFocus={e=>{if(!readOnly)e.target.style.borderColor=C.accent}}
      onBlur={e=>e.target.style.borderColor=C.border}/>
  );
  const Spin=({size=20,color=C.accent})=>(
    <span className="spin" style={{width:size,height:size,border:`3px solid ${color}22`,
      borderTopColor:color,borderRadius:'50%',flexShrink:0}}/>
  );
  const Btn=({children,onClick,color=C.accent,disabled,small,danger,full,loading,style})=>(
    <button onClick={onClick} disabled={disabled||loading}
      style={{background:disabled?C.faint:danger?'#400010':'transparent',
        border:`2px solid ${disabled?C.muted:danger?C.red:color}`,
        color:disabled?C.muted:danger?C.red:color,borderRadius:8,
        padding:small?'6px 14px':'10px 20px',cursor:disabled||loading?'not-allowed':'pointer',
        fontSize:small?12:14,...font,fontWeight:600,width:full?'100%':'auto',
        display:'flex',alignItems:'center',justifyContent:'center',gap:6,transition:'all .2s',...style}}>
      {loading&&<Spin size={14} color={disabled?C.muted:danger?C.red:color}/>}{children}
    </button>
  );
  const Msg=({text,ok})=>text?(
    <div style={{padding:'11px 14px',borderRadius:8,fontSize:13,lineHeight:1.5,
      background:ok?`${C.green}14`:`${C.red}14`,border:`1px solid ${ok?C.green:C.red}44`,
      color:ok?C.green:C.red}}>{text}</div>
  ):null;

  // ── App ───────────────────────────────────────────────────────────────────
  function NexusTrader(){
    // Core
    const [tab,setTab]=useState('dashboard');
    const [fbUser,setFbUser]=useState(null);
    const [fbLoading,setFbLoading]=useState(true);
    const [fbError,setFbError]=useState('');
    const [profile,setProfile]=useState(null);
    const [pulse,setPulse]=useState(false);

    // Bot
    const [botOn,setBotOnRaw]=useState(false);
    const setBotOn=v=>{
      setBotOnRaw(v);
      if(fbUser) db.collection('users').doc(fbUser.uid).update({botOn:v,botStart:v?new Date().toISOString():null});
    };

    // Auth form
    const [aScreen,setAScreen]=useState('login');
    const [aName,setAName]=useState('');
    const [aEmail,setAEmail]=useState('');
    const [aPass,setAPass]=useState('');
    const [aConf,setAConf]=useState('');
    const [aPin,setAPin]=useState('');
    const [aMsg,setAMsg]=useState({text:'',ok:false});
    const [aLoading,setALoading]=useState(false);

    // Settings
    const [sTab,setSTab]=useState('api');
    const [anthropicKey,setAnthropicKey]=useState('');
    const [bnKey,setBnKey]=useState('');
    const [bnSec,setBnSec]=useState('');
    const [okxKey,setOkxKey]=useState('');
    const [okxSec,setOkxSec]=useState('');
    const [okxPass,setOkxPass]=useState('');
    const [sMsg,setSMsg]=useState({text:'',ok:false});
    const [sLoading,setSLoading]=useState(false);
    const [pinPass,setPinPass]=useState('');
    const [pinNew,setPinNew]=useState('');
    const [pinMsg,setPinMsg]=useState({text:'',ok:false});

    // Signals
    const [signals,setSignals]=useState([]);
    const [sigLoading,setSigLoading]=useState(false);
    const [sigError,setSigError]=useState('');

    // Bot control
    const [selPairs,setSelPairs]=useState(['BTC/USDT','ETH/USDT','SOL/USDT']);
    const [risk,setRisk]=useState('medium');
    const [tradeAmt,setTradeAmt]=useState('10');
    const [autoOn,setAutoOn]=useState(false);
    const [logs,setLogs]=useState([]);
    const [autoLoading,setAutoLoading]=useState(false);

    // Exchange
    const [exch,setExch]=useState({binance:false,okx:false});

    // Wallet
    const [withAmt,setWithAmt]=useState('');
    const [withAddr,setWithAddr]=useState('');
    const [withMsg,setWithMsg]=useState('');
    const [pinModal,setPinModal]=useState(false);
    const [pinInput,setPinInput]=useState('');
    const [pinMsgW,setPinMsgW]=useState('');

    // Misc
    const [copied,setCopied]=useState('');
    const [countdown,setCountdown]=useState('00:00:00');

    // ── Admin state ─────────────────────────────────────────────────────────
    const [adminUsers,setAdminUsers]=useState([]);
    const [adminLoading,setAdminLoading]=useState(false);
    const [adminSearch,setAdminSearch]=useState('');
    const [adminMsg,setAdminMsg]=useState({text:'',ok:false});
    const [selectedUser,setSelectedUser]=useState(null);
    const [adminPlan,setAdminPlan]=useState('pro');
    const [adminDays,setAdminDays]=useState('30');
    const [adminActionLoading,setAdminActionLoading]=useState(false);
    const [adminTab,setAdminTab]=useState('users');
    const [adminWithdrawals,setAdminWithdrawals]=useState([]);
    const [adminWLoading,setAdminWLoading]=useState(false);
    const [trialLoading,setTrialLoading]=useState(false);

    // ── Firebase auth listener ──────────────────────────────────────────────
    useEffect(()=>{
      // Timeout: if Firebase doesn't respond in 8s, show error
      const timeout = setTimeout(()=>{
        setFbLoading(false);
        setFbError('Cannot connect to Firebase. Please open this app at its GitHub Pages URL, not from a downloaded file.');
      }, 8000);

      return auth.onAuthStateChanged(async user=>{
        clearTimeout(timeout);
        setFbUser(user);setFbLoading(false);
        if(user){
          const snap=await db.collection('users').doc(user.uid).get();
          if(snap.exists){
            const d=snap.data();setProfile(d);
            setBotOnRaw(d.botOn||false);
            setSelPairs(d.selPairs||['BTC/USDT','ETH/USDT','SOL/USDT']);
            setRisk(d.risk||'medium');setTradeAmt(d.tradeAmt||'10');
            setExch({binance:!!d.binanceConnected,okx:!!d.okxConnected});
            // Always refresh refLink in Firestore to match current deployed URL
            const currentBase=(window.location.origin+window.location.pathname).replace(/index\.html$/,'').replace(/\/$/,'');
            const currentRefCode=d.refCode||('NEXUS'+user.uid.slice(0,6).toUpperCase());
            const currentRefLink=`${currentBase}/?ref=${currentRefCode}`;
            if(d.refLink!==currentRefLink){
              db.collection('users').doc(user.uid).update({refCode:currentRefCode,refLink:currentRefLink});
            }
            // Load encrypted keys
            try{
              const ks=await db.collection('users').doc(user.uid).collection('private').doc('apikeys').get();
              if(ks.exists){
                const kd=ks.data(),s=user.uid;
                if(kd.anthropic) setAnthropicKey(dec(kd.anthropic,s));
                if(kd.bnKey)     setBnKey(dec(kd.bnKey,s));
                if(kd.bnSec)     setBnSec(dec(kd.bnSec,s));
                if(kd.okxKey)    setOkxKey(dec(kd.okxKey,s));
                if(kd.okxSec)    setOkxSec(dec(kd.okxSec,s));
                if(kd.okxPass)   setOkxPass(dec(kd.okxPass,s));
              }
            }catch(e){}
          }
        }else{setProfile(null);}
      });
    },[]);

    // Real-time profile
    useEffect(()=>{
      if(!fbUser) return;
      return db.collection('users').doc(fbUser.uid).onSnapshot(snap=>{if(snap.exists)setProfile(snap.data());});
    },[fbUser]);

    // Countdown
    useEffect(()=>{
      const tick=()=>{
        const now=new Date(),hours=[8,14,20];let next=null;
        for(const h of hours){const t=new Date(now);t.setUTCHours(h,0,0,0);if(t>now){next=t;break;}}
        if(!next){next=new Date(now);next.setUTCDate(next.getUTCDate()+1);next.setUTCHours(8,0,0,0);}
        const d=next-now,hh=Math.floor(d/3600000),mm=Math.floor((d%3600000)/60000),ss=Math.floor((d%60000)/1000);
        setCountdown(`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`);
      };
      tick();const i=setInterval(tick,1000);return()=>clearInterval(i);
    },[]);

    // Bot pulse
    useEffect(()=>{
      if(!botOn) return;
      const i=setInterval(()=>setPulse(p=>!p),800);return()=>clearInterval(i);
    },[botOn]);

    // Fonts
    useEffect(()=>{
      const l=document.createElement('link');l.rel='stylesheet';
      l.href='https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&family=Exo+2:wght@400;600;700&display=swap';
      document.head.appendChild(l);
    },[]);

    // ── Auth ────────────────────────────────────────────────────────────────
    const doRegister=async()=>{
      setAMsg({text:'',ok:false});
      if(!aName.trim()) return setAMsg({text:'Enter your name.',ok:false});
      if(!aEmail.includes('@')) return setAMsg({text:'Enter a valid email.',ok:false});
      if(aPass.length<6) return setAMsg({text:'Password min 6 characters.',ok:false});
      if(aPass!==aConf) return setAMsg({text:'Passwords do not match.',ok:false});
      if(aPin.length!==4||isNaN(aPin)) return setAMsg({text:'PIN must be exactly 4 digits.',ok:false});
      setALoading(true);
      try{
        const cr=await auth.createUserWithEmailAndPassword(aEmail.trim(),aPass);
        const uid=cr.user.uid;
        const refCode='NEXUS'+uid.slice(0,6).toUpperCase();
        const base=(window.location.origin+window.location.pathname).replace(/index\.html$/,'').replace(/\/$/,'');
        await db.collection('users').doc(uid).set({
          name:aName.trim(),email:aEmail.trim().toLowerCase(),plan:'free',
          pinHash:CryptoJS.SHA256(aPin).toString(),
          refCode,refLink:`${base}/?ref=${refCode}`,
          referralEarnings:0,totalReferrals:0,
          botOn:false,selPairs:['BTC/USDT','ETH/USDT','SOL/USDT'],risk:'medium',tradeAmt:'10',
          binanceConnected:false,okxConnected:false,
          signalsUsedToday:0,signalsDate:new Date().toDateString(),
          freeTrialUsed:false,
          createdAt:firebase.firestore.FieldValue.serverTimestamp(),
        });
        await cr.user.updateProfile({displayName:aName.trim()});
      }catch(e){setAMsg({text:e.code==='auth/email-already-in-use'?'Email already registered. Log in instead.':e.message,ok:false});}
      setALoading(false);
    };

    const doLogin=async()=>{
      setAMsg({text:'',ok:false});
      if(!aEmail.includes('@')) return setAMsg({text:'Enter a valid email.',ok:false});
      if(!aPass) return setAMsg({text:'Enter your password.',ok:false});
      setALoading(true);
      try{await auth.signInWithEmailAndPassword(aEmail.trim(),aPass);}
      catch(e){setAMsg({text:'Incorrect email or password.',ok:false});}
      setALoading(false);
    };

    const doForgot=async()=>{
      setAMsg({text:'',ok:false});
      if(!aEmail.includes('@')) return setAMsg({text:'Enter your registered email.',ok:false});
      setALoading(true);
      try{
        await auth.sendPasswordResetEmail(aEmail.trim());
        setAMsg({text:'✅ Reset email sent — check your inbox.',ok:true});
      }catch(e){setAMsg({text:'No account found with that email.',ok:false});}
      setALoading(false);
    };

    const doLogout=()=>auth.signOut();

    // ── Save API keys ───────────────────────────────────────────────────────
    const saveKeys=async(type)=>{
      if(!fbUser) return;
      setSLoading(true);setSMsg({text:'',ok:false});
      const s=fbUser.uid;
      const ref=db.collection('users').doc(fbUser.uid).collection('private').doc('apikeys');
      const plan=profile?.plan||'free';
      try{
        if(type==='anthropic'){
          if(!anthropicKey.startsWith('sk-ant-')) return setSMsg({text:'❌ Invalid key — must start with sk-ant-',ok:false});
          await ref.set({anthropic:enc(anthropicKey,s)},{merge:true});
          setSMsg({text:'✅ Anthropic key saved securely.',ok:true});
        }
        if(type==='binance'){
          if(plan==='free') return setSMsg({text:'❌ Upgrade to Pro to connect exchanges.',ok:false});
          if(!bnKey||!bnSec) return setSMsg({text:'❌ Enter both Binance API key and secret.',ok:false});
          await ref.set({bnKey:enc(bnKey,s),bnSec:enc(bnSec,s)},{merge:true});
          await db.collection('users').doc(fbUser.uid).update({binanceConnected:true});
          setExch(p=>({...p,binance:true}));
          setSMsg({text:'✅ Binance connected and keys saved securely.',ok:true});
        }
        if(type==='okx'){
          if(plan==='free') return setSMsg({text:'❌ Upgrade to Pro/VIP to connect exchanges.',ok:false});
          if(plan==='pro'&&exch.binance) return setSMsg({text:'❌ Pro supports 1 exchange. Upgrade to VIP for both.',ok:false});
          if(!okxKey||!okxSec||!okxPass) return setSMsg({text:'❌ Enter OKX key, secret, and passphrase.',ok:false});
          await ref.set({okxKey:enc(okxKey,s),okxSec:enc(okxSec,s),okxPass:enc(okxPass,s)},{merge:true});
          await db.collection('users').doc(fbUser.uid).update({okxConnected:true});
          setExch(p=>({...p,okx:true}));
          setSMsg({text:'✅ OKX connected and keys saved securely.',ok:true});
        }
      }catch(e){setSMsg({text:'❌ Save failed. Check connection.',ok:false});}
      setSLoading(false);
    };

    const removeExch=async(e)=>{
      if(!fbUser) return;
      const ref=db.collection('users').doc(fbUser.uid).collection('private').doc('apikeys');
      if(e==='binance'){
        await ref.set({bnKey:'',bnSec:''},{merge:true});
        await db.collection('users').doc(fbUser.uid).update({binanceConnected:false});
        setBnKey('');setBnSec('');setExch(p=>({...p,binance:false}));
      }else{
        await ref.set({okxKey:'',okxSec:'',okxPass:''},{merge:true});
        await db.collection('users').doc(fbUser.uid).update({okxConnected:false});
        setOkxKey('');setOkxSec('');setOkxPass('');setExch(p=>({...p,okx:false}));
      }
      setSMsg({text:`✅ ${e==='binance'?'Binance':'OKX'} disconnected.`,ok:true});
    };

    // ── Change PIN ──────────────────────────────────────────────────────────
    const doChangePin=async()=>{
      setPinMsg({text:'',ok:false});
      if(!pinPass) return setPinMsg({text:'Enter your current password.',ok:false});
      if(pinNew.length!==4||isNaN(pinNew)) return setPinMsg({text:'New PIN must be 4 digits.',ok:false});
      setSLoading(true);
      try{
        const cr=firebase.auth.EmailAuthProvider.credential(fbUser.email,pinPass);
        await fbUser.reauthenticateWithCredential(cr);
        await db.collection('users').doc(fbUser.uid).update({pinHash:CryptoJS.SHA256(pinNew).toString()});
        setPinMsg({text:'✅ PIN updated successfully.',ok:true});
        setPinPass('');setPinNew('');
      }catch(e){setPinMsg({text:'❌ Incorrect password.',ok:false});}
      setSLoading(false);
    };

    // ── Signals ─────────────────────────────────────────────────────────────
    const fetchSignals=async()=>{
      const plan=profile?.plan||'free';
      const limit=PLANS[plan].signals;
      const today=new Date().toDateString();
      const used=profile?.signalsDate===today?profile.signalsUsedToday||0:0;
      if(plan==='free'&&used>=limit){setSigError(`Free plan: ${limit} signals/day used. Upgrade to Pro for unlimited.`);return;}
      if(!anthropicKey){setSigError('Add your Anthropic API key in Settings → API Keys.');return;}
      setSigLoading(true);setSigError('');
      try{
        const res=await fetch('https://api.anthropic.com/v1/messages',{
          method:'POST',
          headers:{'Content-Type':'application/json','x-api-key':anthropicKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
          body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1200,
            messages:[{role:'user',content:`You are a professional crypto market analyst. Generate realistic AI trading signals. Return ONLY a valid JSON array, no markdown, no preamble:
[{"pair":"BTC/USDT","signal":"BUY","price":"67840","target":"69500","stopLoss":"66200","confidence":"87%","reason":"RSI oversold + Golden cross on 4H","change24h":"+2.4%","strength":"STRONG","timeframe":"4H"},...]
Generate for: BTC/USDT, ETH/USDT, BNB/USDT, SOL/USDT, XRP/USDT, ADA/USDT, DOGE/USDT, AVAX/USDT. Signal: BUY, SELL, or HOLD. Strength: STRONG, MODERATE, WEAK. Use realistic prices.`}]
          })
        });
        const data=await res.json();
        if(data.error) throw new Error(data.error.message);
        const raw=data.content?.[0]?.text||'[]';
        setSignals(JSON.parse(raw.replace(/```json|```/g,'').trim()));
        if(fbUser) await db.collection('users').doc(fbUser.uid).update({signalsUsedToday:used+1,signalsDate:today});
      }catch(e){setSigError('Signal fetch failed. Check your Anthropic API key in Settings.');}
      setSigLoading(false);
    };

    // ── AI Auto Trade ───────────────────────────────────────────────────────
    const runAutoTrade=useCallback(async()=>{
      if(autoLoading||!anthropicKey) return;
      setAutoLoading(true);
      const log=(msg,color)=>setLogs(p=>[{time:new Date().toLocaleTimeString(),msg,color},...p.slice(0,99)]);
      log('◎ AI scanning markets...',C.accent);
      try{
        const res=await fetch('https://api.anthropic.com/v1/messages',{
          method:'POST',
